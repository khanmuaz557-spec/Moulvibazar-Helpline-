<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>মৌলভীবাজার হেল্পলাইন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f4; --surface:#fff; --ink:#14231f; --muted:#5d7069; --line:#e1e9e5;
  --brand:#0f5c4d; --brand-2:#0b4639; --accent:#e8a33d; --call:#1a9c6b; --danger:#c0392b;
  --chip:#e6efeb; --shadow:0 1px 2px rgba(15,60,50,.06),0 6px 18px rgba(15,60,50,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1714;--surface:#15231f;--ink:#e8f1ed;--muted:#8fa69d;--line:#233630;--chip:#1d302a;--brand:#17806b;--brand-2:#0f5c4d;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:760px;margin:0 auto;min-height:100vh}

header{background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 74px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
h1{font-size:1.35rem;margin:0;font-weight:700;line-height:1.2}
.sub{margin:2px 0 0;font-size:.85rem;opacity:.8}

.sticky{position:sticky;top:0;z-index:20;margin-top:-52px;padding:0 14px 10px;background:linear-gradient(var(--bg) 0,var(--bg) 0) no-repeat;}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.search:focus-within{outline:2px solid var(--accent)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:1rem;color:var(--ink);padding:14px 0;min-width:0;outline:none}
.clear{border:0;background:var(--chip);color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer;display:none;font-size:14px;line-height:1}
.clear.show{display:block}

.tabs{display:flex;gap:6px;margin-top:10px;background:var(--surface);padding:5px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.tab{flex:1;border:0;background:none;font:inherit;font-weight:600;font-size:.85rem;color:var(--muted);padding:10px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s,color .2s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--brand);color:#fff}
.tab:focus-visible,.chip:focus-visible,.call:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:.7rem;font-weight:500;opacity:.85}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b1305;font-weight:600}

.meta{padding:10px 18px 2px;font-size:.82rem;color:var(--muted)}
.list{display:grid;gap:12px;padding:8px 14px 40px}
@media(min-width:640px){.list{grid-template-columns:1fr 1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:flex-start}
.avatar{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:700;font-size:1.1rem;color:#fff}
.t-d{background:linear-gradient(135deg,#17806b,#0f5c4d)}
.t-a{background:linear-gradient(135deg,#d9534f,#a93226)}
.t-g{background:linear-gradient(135deg,#e8a33d,#b8741a)}
.name{margin:0;font-size:1.05rem;font-weight:700;line-height:1.3}
.deg{margin:0;font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;margin-top:4px;background:var(--chip);color:var(--brand);font-size:.76rem;font-weight:600;padding:2px 10px;border-radius:999px}
@media(prefers-color-scheme:dark){.tag{color:#7fd6bd}}
.rows{display:grid;gap:6px;font-size:.88rem}
.row{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.row svg{width:16px;height:16px;flex:none;margin-top:4px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.call{flex:1 1 140px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--call);color:#fff;text-decoration:none;font-weight:600;border-radius:14px;padding:0 14px;font-size:.98rem}
.call:active{transform:scale(.98)}
.call svg{width:18px;height:18px}

.install{margin-left:auto;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:.82rem;padding:6px 12px;border-radius:999px;cursor:pointer;flex:none}
.install[hidden]{display:none}
.top>div:nth-child(2){min-width:0}
.fav{margin-left:auto;flex:none;border:0;background:var(--chip);color:var(--muted);width:38px;height:38px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.fav svg{width:19px;height:19px}
.fav[aria-pressed="true"]{background:#fde8e6;color:var(--danger)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.fav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-color-scheme:dark){.fav[aria-pressed="true"]{background:#3a1f1c;color:#ff8a7d}}
.state{margin:30px 18px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.state button{margin-top:12px;border:0;background:var(--brand);color:#fff;font:inherit;padding:10px 20px;border-radius:12px;cursor:pointer}
.sk{height:132px;border-radius:18px;background:linear-gradient(90deg,var(--chip) 25%,var(--line) 50%,var(--chip) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{text-align:center;font-size:.76rem;color:var(--muted);padding:0 18px 26px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.6-9-9.2C1.6 8 3.9 4.5 7.3 4.5c2 0 3.5 1 4.7 2.6 1.2-1.6 2.7-2.6 4.7-2.6 3.4 0 5.7 3.5 4.3 7.3C19 16.4 12 21 12 21z"/></svg></div>
      <div>
        <h1>মৌলভীবাজার হেল্পলাইন</h1>
        <p class="sub">ডাক্তার, অ্যাম্বুলেন্স ও প্রশাসনিক নম্বর এক জায়গায়</p>
      </div>
      <button id="install" class="install" type="button" hidden>ইনস্টল করুন</button>
    </div>
  </header>

  <div class="sticky">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">খুঁজুন</span>
      <input id="q" type="search" placeholder="নাম, বিশেষজ্ঞ বা ঠিকানা দিয়ে খুঁজুন" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clr" type="button" aria-label="মুছুন">✕</button>
    </label>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>

  <div class="chips" id="chips" aria-label="ফিল্টার"></div>
  <div class="meta" id="meta" aria-live="polite"></div>
  <main class="list" id="list"></main>
  <footer>জরুরি অবস্থায় ৯৯৯ নম্বরে কল করুন</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyOQ585IKZVN550n8zot80gEwmVbfp320o",
  authDomain: "moulvibazarhelpline-24aef.firebaseapp.com",
  projectId: "moulvibazarhelpline-24aef",
  storageBucket: "moulvibazarhelpline-24aef.firebasestorage.app",
  messagingSenderId: "130294730128",
  appId: "1:130294730128:web:faa46a10ce36c4561af715"
};

const app = initializeApp(firebaseConfig);
let db;
try {
  // Offline cache: data stays available when the connection drops
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = initializeFirestore(app, {});
}

const I = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.6-9-9.2C1.6 8 3.9 4.5 7.3 4.5c2 0 3.5 1 4.7 2.6 1.2-1.6 2.7-2.6 4.7-2.6 3.4 0 5.7 3.5 4.3 7.3C19 16.4 12 21 12 21z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M12 15v2a4 4 0 0 0 8 0v-1"/><circle cx="20" cy="14" r="2"/></svg>',
  amb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V6h11v10M14 9h4l3 3v4h-3"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M8.5 8v4M6.5 10h4"/></svg>',
  gov:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>',
  call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>'
};

// Each tab: Firestore collection, how to read a record, which chip filter field to use
const first = (o, keys) => { for (const k of keys) if (o[k] != null && String(o[k]).trim()) return String(o[k]).trim(); return ''; };
const CONFIG = {
  Doctors: { label:'ডাক্তার', icon:I.doc, cls:'t-d', chipLabel:'সব বিশেষজ্ঞ',
    map:d=>({ name:first(d,['name']), sub:first(d,['degree']), tag:first(d,['specialty']), place:first(d,['chamber']), time:first(d,['visiting_hours']), phone:first(d,['phone']) }) },
  Ambulances: { label:'অ্যাম্বুলেন্স', icon:I.amb, cls:'t-a', chipLabel:'সব এলাকা',
    map:d=>({ name:first(d,['name']), sub:'', tag:'', place:first(d,['address']), time:'', phone:first(d,['phone']) }) },
  Administrations: { label:'প্রশাসন', icon:I.gov, cls:'t-g', chipLabel:'সব পদবি',
    map:d=>({ name:first(d,['name']), sub:'', tag:first(d,['specialty/designation','specialty','designation']), place:first(d,['chamber/address','chamber','address']), time:'', phone:first(d,['phone']) }) }
};
CONFIG.Favorites = { label:'প্রিয়', icon:I.heart, cls:'t-d', chipLabel:'সব', virtual:true };
const KEYS = Object.keys(CONFIG);                       // tabs (includes Favorites)
const DATA_KEYS = KEYS.filter(k => !CONFIG[k].virtual); // Firestore collections

const state = { tab:'Doctors', q:'', chip:'', data:{}, loaded:{}, error:null };
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('mbh_favs') || '[]')); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem('mbh_favs', JSON.stringify([...favs])); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Splits "01711-111111, 01811-222222" / "... ও ..." into separate numbers
const phones = p => String(p || '').split(/[,/;،\n]|\s+(?:ও|or|and)\s+/i).map(x => x.trim()).filter(x => norm(x).replace(/\D/g,'').length >= 3);
const telHref = n => 'tel:' + norm(n).replace(/[^\d+]/g,'');
// Bengali digits -> ASCII for search/tel, so both "০১৭১" and "0171" match
const norm = s => String(s).toLowerCase().replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const toBn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

const isLoaded = k => k === 'Favorites' ? DATA_KEYS.some(x => state.loaded[x]) : !!state.loaded[k];
const rowsOf = k => k === 'Favorites' ? DATA_KEYS.flatMap(x => state.data[x] || []).filter(r => favs.has(r.id)) : (state.data[k] || []);
const count = k => k === 'Favorites' ? toBn(favs.size) : (state.loaded[k] ? toBn(state.data[k].length) : '…');

// ---------- Rendering ----------
function renderTabs(){
  $('tabs').innerHTML = KEYS.map(k => `
    <button class="tab" role="tab" aria-selected="${k===state.tab}" data-tab="${k}">
      ${CONFIG[k].icon}<span>${CONFIG[k].label}</span>
      <span class="count">${count(k)}</span>
    </button>`).join('');
}

function renderChips(){
  const cfg = CONFIG[state.tab];
  const tags = [...new Set(rowsOf(state.tab).map(r=>r.tag).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'bn'));
  $('chips').style.display = tags.length ? '' : 'none';
  $('chips').innerHTML = `<button class="chip" aria-pressed="${!state.chip}" data-chip="">${cfg.chipLabel}</button>` +
    tags.map(t => `<button class="chip" aria-pressed="${state.chip===t}" data-chip="${esc(t)}">${esc(t)}</button>`).join('');
}

function card(r){
  const cls = CONFIG[r._k].cls;
  const on = favs.has(r.id);
  const ini = esc([...r.name][0] || '?');
  return `<article class="card">
    <div class="top">
      <div class="avatar ${cls}" aria-hidden="true">${ini}</div>
      <div>
        <h2 class="name">${esc(r.name)}</h2>
        ${r.sub ? `<p class="deg">${esc(r.sub)}</p>` : ''}
        ${r.tag ? `<span class="tag">${esc(r.tag)}</span>` : ''}
      </div>
      <button class="fav" type="button" data-fav="${esc(r.id)}" aria-pressed="${on}" aria-label="প্রিয় তালিকায় যোগ বা বাদ দিন">${I.heart}</button>
    </div>
    <div class="rows">
      ${r.place ? `<div class="row">${I.pin}<span>${esc(r.place)}</span></div>` : ''}
      ${r.time ? `<div class="row">${I.clock}<span>${esc(r.time)}</span></div>` : ''}
    </div>
    ${phones(r.phone).length ? `<div class="actions">${phones(r.phone).map(n => `<a class="call" href="${esc(telHref(n))}" aria-label="${esc(r.name)} — ${esc(n)} নম্বরে কল করুন">${I.call}<span>${esc(n)}</span></a>`).join('')}</div>` : ''}
  </article>`;
}

function render(){
  const list = $('list'), cfg = CONFIG[state.tab];
  renderTabs();
  if (state.error && !isLoaded(state.tab)) {
    $('chips').innerHTML = ''; $('meta').textContent = '';
    list.innerHTML = `<div class="state" style="grid-column:1/-1"><b>তথ্য লোড করা যায়নি</b>${state.error.code === 'permission-denied' ? 'Firestore Rules-এ read অনুমতি দিন (allow read: if true)।' : 'ইন্টারনেট সংযোগ ও Firestore Rules যাচাই করুন।'}<br><small style="opacity:.7;direction:ltr;display:inline-block;margin-top:6px">${esc(state.error.code || state.error.message || '')}</small><br><button id="retry">আবার চেষ্টা করুন</button></div>`;
    return;
  }
  if (!isLoaded(state.tab)) {
    $('chips').innerHTML = ''; $('meta').textContent = '';
    list.innerHTML = '<div class="sk"></div>'.repeat(4);
    return;
  }
  renderChips();
  const q = norm(state.q.trim());
  const words = q.split(/\s+/).filter(Boolean);
  const rows = rowsOf(state.tab).filter(r => {
    if (state.chip && r.tag !== state.chip) return false;
    if (!words.length) return true;
    return words.every(w => r._s.includes(w));
  });
  $('meta').textContent = `${toBn(rows.length)} টি ফলাফল`;
  list.innerHTML = rows.length ? rows.map(r => card(r)).join('')
    : `<div class="state" style="grid-column:1/-1">${state.tab==='Favorites' && !favs.size ? '<b>কোনো প্রিয় নম্বর নেই</b>কার্ডের হার্ট চিহ্নে চাপ দিয়ে নম্বর সেভ করুন।' : '<b>কিছু পাওয়া যায়নি</b>অন্য শব্দ দিয়ে খুঁজুন বা ফিল্টার মুছে দিন।'}</div>`;
}

// ---------- Events ----------
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; state.chip = ''; render(); window.scrollTo({top:0});
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-chip]'); if (!b) return;
  state.chip = b.dataset.chip; render();
});
let timer;
$('q').addEventListener('input', e => {
  state.q = e.target.value; $('clr').classList.toggle('show', !!state.q);
  clearTimeout(timer); timer = setTimeout(render, 80);
});
$('clr').addEventListener('click', () => { $('q').value=''; state.q=''; $('clr').classList.remove('show'); render(); $('q').focus(); });
$('list').addEventListener('click', e => {
  if (e.target.id === 'retry') return location.reload();
  const b = e.target.closest('[data-fav]'); if (!b) return;
  const id = b.dataset.fav;
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs();
  if (state.tab === 'Favorites') render();
  else { b.setAttribute('aria-pressed', favs.has(id)); renderTabs(); }
});

// ---------- PWA: install button + service worker ----------
let deferredInstall;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('install').hidden = false; });
window.addEventListener('appinstalled', () => { $('install').hidden = true; });
$('install').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt(); await deferredInstall.userChoice;
  deferredInstall = null; $('install').hidden = true;
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ---------- Firestore (realtime) ----------
DATA_KEYS.forEach(k => {
  onSnapshot(collection(db, k), snap => {
    state.data[k] = snap.docs.map(d => {
      const r = CONFIG[k].map(d.data()); r._k = k; r.id = k + ':' + d.id;
      r._s = norm([r.name,r.sub,r.tag,r.place,r.time,r.phone].join(' '));
      return r;
    }).filter(r => r.name).sort((a,b) => a.name.localeCompare(b.name,'bn'));
    state.loaded[k] = true; state.error = null; render();
  }, err => { console.error(k, err); state.error = err; render(); });
});
render();
</script>
</body>
</html>
